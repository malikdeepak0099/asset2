<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search properties — KEY GROUP Real Estate</title>
<meta name="description" content="Search apartments, houses and commercial property for rent and sale in Tbilisi and Batumi — KEY GROUP and owner listings.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/portal.css">
<style>
.layout{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start;padding:28px 0 64px}
.filters{position:sticky;top:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.more{display:flex;justify-content:center;margin-top:28px}
#map{height:620px;border-radius:18px;border:1px solid var(--line);overflow:hidden;background:#E8EEF3}
.mp b{font:800 15px var(--display)}.mp a{color:var(--blue);font-weight:700}
.vt{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}.vt button{border:0;background:none;padding:7px 12px;border-radius:9px;font:700 13px var(--display);cursor:pointer;color:var(--muted)}
.vt button[aria-pressed="true"]{background:var(--navy);color:#fff}
@media (max-width:900px){#map{height:480px}}
@media (max-width:900px){.layout{grid-template-columns:1fr}.filters{position:static}}
</style>
</head>
<body>
<main class="wrap">
  <div class="layout">
    <form class="card filters" id="f" role="search">
      <h3 id="ftitle">ფილტრები</h3>
      <div class="seg" role="group" aria-label="Deal">
        <button type="button" data-deal="" aria-pressed="true" id="d-all">ყველა</button>
        <button type="button" data-deal="rent" aria-pressed="false" id="d-rent">ქირა</button>
        <button type="button" data-deal="sale" aria-pressed="false" id="d-sale">იყიდება</button>
      </div>
      <label class="f"><span id="l-type">ტიპი</span><select name="type"><option value=""></option><option value="flat"></option><option value="house"></option><option value="commercial"></option><option value="land"></option></select></label>
      <label class="f"><span id="l-dist">უბანი / მისამართი</span><input name="district" placeholder="ვაკე, Saburtalo…"></label>
      <div class="grid2"><label class="f"><span id="l-pmin">ფასი, დან</span><input name="min" type="number" min="0" inputmode="numeric"></label><label class="f"><span id="l-pmax">მდე</span><input name="max" type="number" min="0" inputmode="numeric"></label></div>
      <div class="grid2"><label class="f"><span id="l-rooms">ოთახები</span><select name="rooms"><option value="">—</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></label><label class="f"><span id="l-area">ფართი მ², დან</span><input name="area" type="number" min="0" inputmode="numeric"></label></div>
      <label class="f"><span id="l-sort">დალაგება</span><select name="sort"><option value=""></option><option value="new"></option><option value="price_asc"></option><option value="price_desc"></option><option value="area_desc"></option></select></label>
      <label style="display:flex;gap:8px;align-items:center;font:600 14px var(--display)"><input type="checkbox" name="photos"> <span id="l-photos">მხოლოდ ფოტოებით</span></label>
      <label style="display:flex;gap:8px;align-items:center;font:600 14px var(--display)"><input type="checkbox" name="verified"> <span id="l-ver">მხოლოდ შემოწმებული</span></label>
      <label style="display:flex;gap:8px;align-items:center;font:600 14px var(--display)"><input type="checkbox" name="drop"> <span id="l-drop">ფასი შემცირდა</span></label>
      <button class="btn b-coral" type="submit" id="go">ძიება</button>
      <button class="btn b-ghost" type="button" id="reset">გასუფთავება</button>
    </form>
    <section aria-live="polite">
      <div class="bar"><h1 id="h">განცხადებები</h1><span style="display:flex;gap:12px;align-items:center"><span class="muted" id="count"></span><button type="button" class="btn sm b-ghost" id="ssave"></button><span class="vt" role="group" aria-label="View"><button type="button" data-v="list" aria-pressed="true" id="v-list">☰</button><button type="button" data-v="map" aria-pressed="false" id="v-map">🗺</button></span></span></div>
      <div id="saved" style="margin-bottom:14px"></div>
      <div id="map" class="hidden"></div>
      <div class="lgrid" id="grid"><div class="empty">…</div></div>
      <div class="more"><button class="btn b-ghost hidden" id="moreBtn" type="button"></button></div>
    </section>
  </div>
</main>
<script src="/assets/portal.js"></script>
<script src="/assets/chat.js" defer></script>
<script>
(function () {
  var t = KG.t, $ = KG.$, $$ = KG.$$;
  var params = new URLSearchParams(location.search), favMode = params.get('fav') === '1';
  KG.header(favMode ? 'fav' : 'search');
  document.documentElement.lang = KG.lang === 'en' ? 'en' : 'ka';
  // texts
  $('#ftitle').textContent = t('Filters', 'ფილტრები'); $('#d-all').textContent = t('All', 'ყველა'); $('#d-rent').textContent = t('Rent', 'ქირა'); $('#d-sale').textContent = t('Buy', 'ყიდვა');
  $('#l-type').textContent = t('Property type', 'ქონების ტიპი'); $('#l-dist').textContent = t('District / address', 'უბანი / მისამართი');
  $('#l-pmin').textContent = t('Price from', 'ფასი, დან'); $('#l-pmax').textContent = t('to', 'მდე'); $('#l-rooms').textContent = t('Rooms', 'ოთახები');
  $('#l-area').textContent = t('Area from, m²', 'ფართი მ², დან'); $('#l-sort').textContent = t('Sort', 'დალაგება'); $('#l-photos').textContent = t('Only with photos', 'მხოლოდ ფოტოებით');
  $('#l-ver').textContent = t('Only verified', 'მხოლოდ შემოწმებული'); $('#l-drop').textContent = t('Price reduced', 'ფასი შემცირდა');
  $('#ssave').innerHTML = KG.icon('bell') + t('Save search', 'ძიების შენახვა'); if (favMode) $('#ssave').classList.add('hidden');
  $('#go').textContent = t('Show results', 'ძიება'); $('#reset').textContent = t('Clear filters', 'გასუფთავება');
  var ts = $('select[name=type]').options; ts[0].text = t('Any type', 'ყველა'); ts[1].text = KG.TYPE('flat'); ts[2].text = KG.TYPE('house'); ts[3].text = KG.TYPE('commercial'); ts[4].text = KG.TYPE('land');
  var so = $('select[name=sort]').options; so[0].text = t('Recommended (VIP first)', 'რეკომენდებული (VIP პირველი)'); so[1].text = t('Newest', 'ახალი'); so[2].text = t('Price: low to high', 'ფასი: ზრდადობით'); so[3].text = t('Price: high to low', 'ფასი: კლებადობით'); so[4].text = t('Largest area', 'დიდი ფართი');
  $('#h').textContent = favMode ? t('Saved listings', 'შენახული განცხადებები') : t('Properties', 'განცხადებები');

  var ALL = [], shown = 24, deal = params.get('deal') || '', VIEW = params.get('view') === 'map' ? 'map' : 'list', LAST = [], MAP = null, LAYER = null;
  $('#v-list').textContent = '☰ ' + t('List', 'სია'); $('#v-map').textContent = '🗺 ' + t('Map', 'რუკა');
  function drawMap() {
    KG.leaflet().then(function (L) {
      if (!MAP) MAP = KG.baseMap('map', null, 12);
      if (LAYER) LAYER.remove();
      LAYER = L.layerGroup().addTo(MAP);
      var pts = [];
      LAST.forEach(function (l) {
        var c = KG.coords(l); if (!c) return; pts.push(c);
        var col = l.tier === 'super' ? '#F45D48' : l.tier === 'vip' ? '#7C5CFF' : l.deal === 'sale' ? '#B5475E' : '#0E9F9A';
        L.circleMarker(c, {radius: l.tier ? 9 : 7, color: '#fff', weight: 2, fillColor: col, fillOpacity: .95}).addTo(LAYER)
          .bindPopup('<div class="mp"><b>' + KG.money(l.price, l.cur) + (l.deal !== 'sale' ? ' / ' + t('month', 'თვე') : '') + '</b><br>' + KG.esc(l.title || KG.TYPE(l.type)) + '<br><span style="color:#5E6E82">' + KG.esc([l.district, l.rooms ? l.rooms + ' ' + t('rooms', 'ოთახი') : '', l.area ? l.area + ' m²' : ''].filter(Boolean).join(' · ')) + '</span><br><a href="' + KG.esc(l.url) + '"' + (l.src === 'crm' ? ' target="_blank" rel="noopener"' : '') + '>' + t('Open', 'გახსნა') + ' →</a></div>');
      });
      setTimeout(function () { MAP.invalidateSize(); if (pts.length) MAP.fitBounds(pts, {padding: [30, 30], maxZoom: 15}); }, 50);
    }).catch(function () { $('#map').innerHTML = '<div class="empty">' + t('Map could not load.', 'რუკა ვერ ჩაიტვირთა.') + '</div>'; });
  }
  function setView(v) {
    VIEW = v;
    $$('.vt button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === v ? 'true' : 'false'); });
    $('#map').classList.toggle('hidden', v !== 'map'); $('#grid').classList.toggle('hidden', v === 'map'); $('#moreBtn').parentNode.classList.toggle('hidden', v === 'map');
    if (v === 'map') drawMap();
  }
  $$('.vt button').forEach(function (b) { b.onclick = function () { setView(b.dataset.v); }; });
  var f = $('#f');
  ['type', 'district', 'min', 'max', 'rooms', 'area', 'sort'].forEach(function (k) { if (params.get(k)) f[k].value = params.get(k); });
  ['photos', 'verified', 'drop'].forEach(function (k) { if (params.get(k)) f[k].checked = true; });
  function setDeal(d) { deal = d; $$('.seg button', f).forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.deal === d ? 'true' : 'false'); }); }
  setDeal(deal);
  $$('.seg button', f).forEach(function (b) { b.onclick = function () { setDeal(b.dataset.deal); run(true); }; });

  function rank(l) { return l.tier === 'super' ? 2 : l.tier === 'vip' ? 1 : 0; }
  function formParams() {
    var p = new URLSearchParams();
    if (deal) p.set('deal', deal);
    ['type', 'district', 'min', 'max', 'rooms', 'area', 'sort'].forEach(function (k) { if (f[k].value) p.set(k, f[k].value); });
    ['photos', 'verified', 'drop'].forEach(function (k) { if (f[k].checked) p.set(k, '1'); });
    return p;
  }
  function matches(l, p) {
    var q = (p.get('district') || '').trim().toLowerCase(), min = +p.get('min') || 0, max = +p.get('max') || 0, rooms = +p.get('rooms') || 0, area = +p.get('area') || 0;
    if (p.get('deal') && l.deal !== p.get('deal')) return false;
    if (p.get('type') && l.type !== p.get('type')) return false;
    if (q && ((l.district || '') + ' ' + (l.districtKa || '') + ' ' + (l.address || '') + ' ' + (l.title || '')).toLowerCase().indexOf(q) < 0) return false;
    if (min && l.price < min) return false;
    if (max && l.price > max) return false;
    if (rooms && (l.rooms || 0) < rooms) return false;
    if (area && (l.area || 0) < area) return false;
    if (p.get('photos') && !l.photo) return false;
    if (p.get('verified') && !(l.vlevel >= 2 || l.src === 'crm')) return false;
    if (p.get('drop') && !l.drop) return false;
    return true;
  }
  // ---------- saved searches (this browser): remember the results you have seen, show how many are new
  function SS() { try { return JSON.parse(localStorage.getItem('kg_ss') || '[]'); } catch (e) { return []; } }
  function SSsave(a) { try { localStorage.setItem('kg_ss', JSON.stringify(a.slice(0, 10))); } catch (e) {} }
  function ssName(p) {
    var parts = [p.get('deal') ? KG.DEAL(p.get('deal')) : t('All', 'ყველა'), p.get('type') ? KG.TYPE(p.get('type')) : '', p.get('district') || '',
      p.get('max') ? t('up to ', 'მდე ') + p.get('max') : '', p.get('rooms') ? p.get('rooms') + '+ ' + t('rooms', 'ოთახი') : ''];
    return parts.filter(Boolean).join(' · ');
  }
  function drawSaved() {
    var a = SS();
    if (favMode || !a.length) { $('#saved').innerHTML = ''; return; }
    $('#saved').innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b style="font:700 13px var(--display);color:var(--muted)">' + KG.icon('bell') + ' ' + t('Saved searches', 'შენახული ძიებები') + '</b>' + a.map(function (x) {
      var p = new URLSearchParams(x.qs), n = 0;
      if (ALL.length) ALL.forEach(function (l) { if (matches(l, p) && x.seen.indexOf(l.key) < 0) n++; });
      return '<span class="pill" style="background:#fff;border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center;padding:6px 10px"><a href="?' + x.qs + '&ss=' + x.id + '" style="color:var(--ink);font-weight:600">' + KG.esc(x.name) + '</a>' +
        (n ? '<b style="background:var(--coral);color:#fff;border-radius:99px;padding:0 7px">' + n + ' ' + t('new', 'ახალი') + '</b>' : '') + '<button type="button" data-ssrm="' + x.id + '" style="border:0;background:none;cursor:pointer;color:var(--muted)" aria-label="' + t('Remove', 'წაშლა') + '">×</button></span>';
    }).join('') + '</div>';
    KG.$$('[data-ssrm]').forEach(function (b) { b.onclick = function () { SSsave(SS().filter(function (x) { return String(x.id) !== b.dataset.ssrm; })); drawSaved(); }; });
  }
  $('#ssave').onclick = function () {
    var p = formParams(); p.delete('sort');
    var qs = p.toString(), a = SS().filter(function (x) { return x.qs !== qs; });
    a.unshift({id: Date.now(), qs: qs, name: ssName(p), seen: LAST.map(function (l) { return l.key; }).slice(0, 800), at: Date.now()});
    SSsave(a); drawSaved(); KG.track('search_saved', {n: LAST.length});
    $('#ssave').innerHTML = KG.icon('check') + t('Saved — we will show new matches here', 'შენახულია — ახალ განცხადებებს აქ ნახავთ');
  };
  function run(push) {
    var cur = formParams();
    var favs = KG.favs();
    var res = ALL.filter(function (l) {
      if (favMode && favs.indexOf(l.key) < 0) return false;
      return matches(l, cur);
    });
    var s = f.sort.value;
    res.sort(function (a, b) {
      if (s === 'price_asc') return a.price - b.price;
      if (s === 'price_desc') return b.price - a.price;
      if (s === 'area_desc') return (b.area || 0) - (a.area || 0);
      if (s === 'new') return (b.created || 0) - (a.created || 0);
      return rank(b) - rank(a) || (b.src === 'owner') - (a.src === 'owner') || (b.created || 0) - (a.created || 0);
    });
    if (push) {
      shown = 24;
      KG.track('search_performed', {deal: deal, type: f.type.value, district: (f.district.value || '').trim().slice(0, 40), results: res.length});
      var p = formParams();
      if (favMode) p.set('fav', '1');
      history.replaceState(null, '', '?' + p.toString());
    }
    LAST = res;
    if (VIEW === 'map') drawMap();
    $('#count').textContent = res.length + ' ' + t('listings', 'განცხადება');
    $('#grid').innerHTML = res.length ? res.slice(0, shown).map(KG.card).join('') :
      '<div class="empty">' + (favMode ? t('No saved listings yet. Tap ♥ on any listing to save it here.', 'შენახული განცხადებები ჯერ არ არის. დააჭირე ♥-ს განცხადებაზე.') :
        t('Nothing matches these filters. Try a wider price or another district — or message us on WhatsApp and we will search for you.', 'ამ ფილტრებით ვერაფერი მოიძებნა. შეცვალე ფილტრები ან მოგვწერე WhatsApp-ზე.')) +
        '<div style="margin-top:14px"><a class="btn b-wa" target="_blank" rel="noopener" href="https://wa.me/995577114118">' + KG.icon('chat') + 'WhatsApp</a></div></div>';
    var mb = $('#moreBtn');
    mb.classList.toggle('hidden', res.length <= shown);
    mb.textContent = t('Show more', 'მეტის ნახვა') + ' (' + (res.length - shown) + ')';
  }
  f.onsubmit = function (e) { e.preventDefault(); run(true); };
  f.addEventListener('change', function () { run(true); });
  $('#reset').onclick = function () { f.reset(); setDeal(''); run(true); };
  $('#moreBtn').onclick = function () { shown += 24; run(false); };
  KG.bindFavs(document, function () { if (favMode) run(false); });
  KG.loadAll().then(function (all) {
    ALL = all; run(false); if (VIEW === 'map') setView('map');
    var ssid = params.get('ss');
    if (ssid) { var a = SS(); a.forEach(function (x) { if (String(x.id) === ssid) { LAST.forEach(function (l) { if (x.seen.indexOf(l.key) < 0) x.seen.unshift(l.key); }); x.seen = x.seen.slice(0, 800); } }); SSsave(a); }
    drawSaved(); KG.cmpBar();
  });
})();
</script>
</body>
</html>
