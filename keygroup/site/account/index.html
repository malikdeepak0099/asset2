<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My listings — KEY GROUP Real Estate</title>
<meta name="description" content="Add your apartment, house or commercial property for sale or rent on keygroup.ge.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/portal.css">
<style>
.pg{padding:28px 0 64px}
.auth{max-width:460px;margin:20px auto;padding:28px;display:flex;flex-direction:column;gap:14px}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stats .card{padding:16px 18px}.stats b{display:block;font:800 26px var(--display)}.stats span{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:120px 1fr auto;gap:16px;padding:14px;align-items:center;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .th{width:120px;height:86px;border-radius:12px;background:#DCE3EA center/cover}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.formcard{padding:24px;display:flex;flex-direction:column;gap:16px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.photos .p{width:120px;height:90px;border-radius:12px;background:#DCE3EA center/cover;position:relative}
.photos .p button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(8,26,48,.8);color:#fff;cursor:pointer}
.photos .p .main{position:absolute;left:4px;bottom:4px;font:700 10px var(--display);background:var(--gold);color:var(--navy-deep);border-radius:6px;padding:2px 6px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:#fff}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plan{border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:#fff;text-align:left}
.plan[aria-pressed="true"]{border-color:var(--coral);background:var(--blush)}
.plan b{font:800 22px var(--display)}
dialog{border:0;border-radius:20px;padding:24px;max-width:680px;width:94vw}
dialog::backdrop{background:rgba(5,12,24,.5)}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:80px 1fr}.row .th{width:80px;height:64px}.row .acts{grid-column:1/-1;justify-content:flex-start}.plans{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap pg" id="app"><div class="empty">…</div></main>
<dialog id="promo"></dialog>
<script src="/assets/portal.js"></script>
<script src="/assets/chat.js" defer></script>
<script>
(function () {
  var t = KG.t, esc = KG.esc, $ = KG.$, $$ = KG.$$, api = KG.api;
  KG.header('account');
  document.documentElement.lang = KG.lang === 'en' ? 'en' : 'ka';
  var ME = null, SETTINGS = null, DATA = {listings: [], orders: []}, TAB = location.hash === '#profile' ? 'profile' : location.hash === '#leads' ? 'leads' : 'listings';
  var PARTNER = function () { return ME && ['agent', 'agency', 'developer', 'admin'].indexOf(ME.role) >= 0; };
  var ROLE = function (r) { return {agent: t('Agent', 'აგენტი'), agency: t('Agency', 'სააგენტო'), developer: t('Developer', 'დეველოპერი'), admin: 'Admin', owner: t('Owner', 'მესაკუთრე')}[r] || r; };
  var STAGES = [['new', t('New', 'ახალი')], ['contacted', t('Contacted', 'დაკავშირებული')], ['viewing', t('Viewing', 'დათვალიერება')], ['offer', t('Offer', 'შეთავაზება')], ['closed', t('Deal closed', 'გარიგება')], ['lost', t('Lost', 'დაკარგული')]];
  function tabs() {
    var nl = (ME && ME.new_leads) || 0;
    return '<div class="seg" style="max-width:760px;margin:0 0 16px">' + [['listings', t('My listings', 'განცხადებები')], ['leads', t('Leads', 'მოთხოვნები') + (nl ? ' (' + nl + ')' : '')]].concat(ME.role === 'developer' || ME.role === 'admin' ? [['projects', t('Projects', 'პროექტები')]] : []).concat(ME.role === 'agency' ? [['team', t('Team', 'გუნდი')]] : []).concat(PARTNER() ? [['bulk', t('Bulk upload', 'მასობრივი ატვირთვა')], ['profile', t('My profile', 'ჩემი პროფილი')]] : []).map(function (x) {
      return '<button type="button" data-tab="' + x[0] + '" aria-pressed="' + (TAB === x[0]) + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>';
  }
  function bindTabs() { $$('[data-tab]').forEach(function (b) { b.onclick = function () { TAB = b.dataset.tab; render(); }; }); }
  function render() { api('/api/me').then(function (j) { if (j.user) { ME = j.user; SETTINGS = j.settings; } ({listings: dash, leads: leads, bulk: bulk, team: team, projects: projects, profile: profile})[TAB](); }); }
  function head() {
    return '<div class="dash-head"><div><h1>' + (TAB === 'team' ? t('Team', 'გუნდი') : TAB === 'projects' ? t('Projects', 'პროექტები') : TAB === 'leads' ? t('Leads', 'მოთხოვნები') : TAB === 'bulk' ? t('Bulk upload', 'მასობრივი ატვირთვა') : TAB === 'profile' ? t('My profile', 'ჩემი პროფილი') : t('My listings', 'ჩემი განცხადებები')) + '</h1><span class="muted">' + esc(ME.name) + (ME.company ? ' · ' + esc(ME.company) : '') + ' · ' + esc(ME.phone) +
      (ME.role !== 'owner' ? ' · <span class="pill t-vip">' + esc(ROLE(ME.role)) + '</span>' : '') + (ME.limit ? ' · ' + t('active listings ', 'აქტიური ') + (ME.live || 0) + ' / ' + ME.limit : '') +
      (ME.partner_until && ME.partner_until * 1000 > Date.now() ? ' · ' + t('Founding Partner until ', 'დამფუძნებელი პარტნიორი: ') + new Date(ME.partner_until * 1000).toLocaleDateString() : '') + '</span></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (ME.role === 'admin' ? '<a class="btn b-navy" href="/admin/">Admin panel</a>' : '') +
      (ME.slug && ME.role !== 'owner' ? '<a class="btn b-ghost" target="_blank" href="/' + esc(ME.slug) + '/">' + KG.icon('eye') + t('My public profile', 'ჩემი საჯარო პროფილი') + '</a>' : '') +
      '<button class="btn b-ghost" id="pwb">🔑 ' + t('Password', 'პაროლი') + '</button>' +
      '<button class="btn b-coral" id="add">' + KG.icon('plus') + t('Add listing', 'განცხადების დამატება') + '</button><button class="btn b-ghost" id="out">' + t('Log out', 'გასვლა') + '</button></div></div>' +
      (ME.pw_set === 0 ? '<form class="card" id="pw1" style="padding:16px;margin-bottom:16px;border:2px solid var(--gold);display:flex;gap:10px;flex-wrap:wrap;align-items:end">' +
        '<div style="flex:1 1 260px"><b>👋 ' + t('Welcome to your KEY GROUP account!', 'კეთილი იყოს შენი მობრძანება KEY GROUP-ის ანგარიშში!') + '</b><div class="muted" style="font-size:13px">' +
        t('Set a password so you can log in any time with your phone number ', 'დააყენე პაროლი, რომ ნებისმიერ დროს შეხვიდე შენი ნომრით ') + esc(ME.phone) + '.</div></div>' +
        '<label class="f" style="flex:0 1 220px">' + t('New password (6+)', 'ახალი პაროლი (6+)') + '<input name="new" type="password" minlength="6" required autocomplete="new-password"></label>' +
        '<button class="btn b-gold" type="submit">' + t('Save password', 'შენახვა') + '</button><div id="pw1m" style="flex-basis:100%"></div></form>' : '') + tabs() +
      (PARTNER() ? KG.findBox() : '');
  }
  function bindHead() {
    $('#add').onclick = function () { form(null); };
    if ($('#pw1')) $('#pw1').onsubmit = function (e) { e.preventDefault(); api('/api/password', {method: 'POST', json: {new: e.target.new.value}}).then(function (r) { $('#pw1m').className = 'msg ' + (r.ok ? 'ok' : 'err'); $('#pw1m').textContent = r.ok ? t('Saved. Log in next time with your phone and this password.', 'შენახულია. შემდეგში შედი ნომრით და ამ პაროლით.') : r.error; if (r.ok) { ME.pw_set = 1; setTimeout(render, 1500); } }); };
    $('#pwb').onclick = function () {
      var old = ME.pw_set === 0 ? '' : prompt(t('Current password', 'ახლანდელი პაროლი'));
      if (old === null) return;
      var nw = prompt(t('New password (at least 6 characters)', 'ახალი პაროლი (მინ. 6 სიმბოლო)'));
      if (!nw) return;
      api('/api/password', {method: 'POST', json: {old: old, new: nw}}).then(function (r) { alert(r.ok ? t('Password changed.', 'პაროლი შეიცვალა.') : r.error); if (r.ok) ME.pw_set = 1; });
    };
    $('#out').onclick = function () { api('/api/logout', {method: 'POST'}).then(function () { ME = null; auth('login'); }); };
    KG.bindFind();
    bindTabs();
  }
  function leads() {
    api('/api/my/leads').then(function (j) {
      var L = j.leads || [], TEAM = j.team || [];
      var soon = L.filter(function (d) { return d.viewing_at && d.viewing_at * 1000 > Date.now() - 3600000; }).sort(function (a, b) { return a.viewing_at - b.viewing_at; });
      var dtl = function (ts) { if (!ts) return ''; var d = new Date(ts * 1000), z = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + 'T' + z(d.getHours()) + ':' + z(d.getMinutes()); };
      $('#app').innerHTML = head() + (soon.length ? '<div class="card" style="padding:16px;margin-bottom:16px"><h3 style="margin-bottom:8px">📅 ' + t('Upcoming viewings', 'დაგეგმილი დათვალიერებები') + '</h3>' + soon.map(function (d) {
          return '<div style="display:flex;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)"><b>' + new Date(d.viewing_at * 1000).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) + '</b><span>' + esc(d.name || '') + ' · <a href="tel:' + esc(d.phone) + '" style="color:var(--blue)">' + esc(d.phone) + '</a></span><span class="muted">#' + d.listing_id + ' ' + esc(d.title || d.district || '') + (d.assigned_name ? ' · ' + esc(d.assigned_name) : '') + '</span></div>'; }).join('') + '</div>' : '') +
        '<div class="card">' + (L.length ? L.map(function (d) {
        return '<div class="row" style="grid-template-columns:1fr auto"><div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b>' + esc(d.name || t('Visitor', 'ვიზიტორი')) + '</b> <a href="tel:' + esc(d.phone) + '" style="color:var(--blue);font-weight:700">' + esc(d.phone) + '</a>' +
          '<a class="btn sm b-wa" target="_blank" rel="noopener" href="https://wa.me/' + esc(String(d.phone).replace(/\D/g, '')) + '">WhatsApp</a><span class="muted" style="font-size:12px">' + new Date(d.created * 1000).toLocaleString() + ' · ' + esc(d.source) + '</span></div>' +
          '<div class="muted" style="font-size:13px;margin-top:4px">' + t('Listing', 'განცხადება') + ' <a href="/p/?id=' + d.listing_id + '" target="_blank" style="color:var(--blue)">#' + d.listing_id + '</a> ' + esc(d.title || d.district || '') + '</div>' +
          (d.message ? '<div style="margin-top:4px">' + esc(d.message) + '</div>' : '') +
          '<input data-note="' + d.id + '" value="' + esc(d.note || '') + '" placeholder="' + t('Note (only you see it)', 'შენიშვნა') + '" style="margin-top:8px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit"></div>' +
          '<div style="display:flex;flex-direction:column;gap:6px;min-width:190px"><select data-stage="' + d.id + '" style="border:1.5px solid var(--line);border-radius:10px;padding:8px;font:inherit">' + STAGES.map(function (x) { return '<option value="' + x[0] + '"' + (d.stage === x[0] ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join('') + '</select>' +
          '<label style="font-size:12px;color:var(--muted)">📅 ' + t('Viewing', 'დათვალიერება') + '<input type="datetime-local" data-view="' + d.id + '" value="' + dtl(d.viewing_at) + '" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:6px;font:inherit"></label>' +
          (TEAM.length ? '<label style="font-size:12px;color:var(--muted)">' + t('Assign to', 'მიმაგრება') + '<select data-assign="' + d.id + '" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:6px;font:inherit"><option value="0">—</option>' + TEAM.map(function (m) { return '<option value="' + m.id + '"' + (d.assigned_to === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('') + '</select></label>' : (d.assigned_name ? '<span class="muted" style="font-size:12px">→ ' + esc(d.assigned_name) + '</span>' : '')) + '</div></div>';
      }).join('') : '<div class="empty" style="border:0">' + t('No enquiries yet. When someone asks about your listing, it appears here and you can call or WhatsApp them.', 'მოთხოვნები ჯერ არ არის. როცა ვინმე თქვენს განცხადებაზე იკითხავს, აქ გამოჩნდება.') + '</div>') + '</div>';
      bindHead();
      $$('[data-stage]').forEach(function (sl) { sl.onchange = function () { api('/api/my/leads', {method: 'POST', json: {id: +sl.dataset.stage, stage: sl.value}}); }; });
      $$('[data-view]').forEach(function (inp) { inp.onchange = function () { var ts = inp.value ? new Date(inp.value).getTime() / 1000 : 0; api('/api/my/leads', {method: 'POST', json: {id: +inp.dataset.view, viewing_at: ts}}).then(leads); }; });
      $$('[data-assign]').forEach(function (sl) { sl.onchange = function () { api('/api/my/leads', {method: 'POST', json: {id: +sl.dataset.assign, assigned_to: +sl.value}}).then(function (r) { if (!r.ok) alert(r.error); }); }; });
      $$('[data-note]').forEach(function (inp) { inp.onchange = function () { api('/api/my/leads', {method: 'POST', json: {id: +inp.dataset.note, note: inp.value}}); }; });
    });
  }
  function team() {
    api('/api/my/team').then(function (j) {
      var M = j.team || [];
      $('#app').innerHTML = head() + '<div class="card" style="padding:20px;max-width:860px"><h2>' + t('Your agents', 'თქვენი აგენტები') + '</h2>' +
        '<p class="muted">' + t('Agents you add log in with their own phone. You see all their listings and enquiries here; they manage their own.', 'აგენტები შედიან საკუთარი ტელეფონით. თქვენ ხედავთ მათ განცხადებებს და მოთხოვნებს.') + '</p>' +
        (M.length ? '<table style="width:100%;font-size:14px"><thead><tr><th style="text-align:left">' + t('Agent', 'აგენტი') + '</th><th style="text-align:left">' + t('Phone', 'ტელეფონი') + '</th><th>' + t('Live', 'აქტიური') + '</th><th>' + t('New leads', 'ახალი') + '</th><th></th></tr></thead><tbody>' +
          M.map(function (m) { return '<tr><td><b>' + esc(m.name) + '</b></td><td>' + esc(m.phone) + '</td><td style="text-align:center">' + m.live + '</td><td style="text-align:center">' + m.new_leads + '</td><td><button class="btn sm b-red" data-rmm="' + m.id + '">' + t('Remove', 'წაშლა') + '</button></td></tr>'; }).join('') + '</tbody></table>'
          : '<p class="muted">' + t('No agents yet.', 'აგენტები ჯერ არ არის.') + '</p>') +
        '<form id="tm" class="grid3" style="margin-top:16px;align-items:end"><label class="f">' + t('Agent name', 'აგენტის სახელი') + '<input name="name" required></label><label class="f">' + t('Agent phone', 'ტელეფონი') + '<input name="phone" type="tel" required></label><button class="btn b-navy" type="submit">' + KG.icon('plus') + t('Add agent', 'დამატება') + '</button></form><div id="tmm" style="margin-top:10px"></div></div>';
      bindHead();
      $('#tm').onsubmit = function (e) {
        e.preventDefault();
        api('/api/my/team', {method: 'POST', json: {name: e.target.name.value, phone: e.target.phone.value}}).then(function (r) {
          if (!r.ok) { $('#tmm').className = 'msg err'; $('#tmm').textContent = r.error; return; }
          if (r.password) alert(t('Agent account created.\nLogin: keygroup.ge/account\nPhone: ', 'აგენტის ანგარიში შეიქმნა.\nშესვლა: keygroup.ge/account\nტელეფონი: ') + r.phone + t('\nPassword: ', '\nპაროლი: ') + r.password);
          team();
        });
      };
      $$('[data-rmm]').forEach(function (b) { b.onclick = function () { if (confirm(t('Remove this agent from your team?', 'წავშალო აგენტი გუნდიდან?'))) api('/api/my/team?id=' + b.dataset.rmm, {method: 'DELETE'}).then(team); }; });
    });
  }
  function projects() {
    api('/api/my/projects').then(function (j) {
      var P = j.projects || [];
      $('#app').innerHTML = head() + '<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn b-navy" id="np">' + KG.icon('plus') + t('New project', 'ახალი პროექტი') + '</button></div>' +
        '<div class="card">' + (P.length ? P.map(function (p) {
          return '<div class="row" style="grid-template-columns:1fr auto"><div><b style="font:700 17px var(--display)">' + esc(p.name) + '</b> <span class="muted">' + esc([p.district, p.address, p.city].filter(Boolean).join(', ')) + '</span>' +
            '<div class="muted" style="font-size:13px">' + t('Completion: ', 'დასრულება: ') + esc(p.handover || p.completion || '—') + (p.inst_months ? ' · ' + t('installment ', 'განვადება ') + p.inst_months + t(' mo', ' თვე') : '') + ' · ' + t('units live ', 'აქტიური ბინები ') + (p.units || 0) + ' / ' + p.all_units + (p.min_price ? ' · ' + t('from ', 'დან ') + KG.money(p.min_price, p.currency) : '') + (p.min_ppm ? ' · ' + KG.money(p.min_ppm, p.currency) + '/m²' : '') + '</div></div>' +
            '<div class="acts"><a class="btn sm b-ghost" href="/project/?id=' + p.id + '" target="_blank">' + t('Public page', 'საჯარო გვერდი') + '</a><button class="btn sm b-ghost" data-pe="' + p.id + '">' + KG.icon('edit') + t('Edit', 'რედაქტირება') + '</button><button class="btn sm b-coral" data-pu="' + p.id + '">' + KG.icon('plus') + t('Add unit', 'ბინის დამატება') + '</button></div></div>';
        }).join('') : '<div class="empty" style="border:0">' + t('No projects yet. Create your first project, then add its units (or upload them by CSV with the project_id column).', 'პროექტები ჯერ არ არის. შექმენით პროექტი და დაამატეთ ბინები.') + '</div>') + '</div>';
      bindHead();
      $('#np').onclick = function () { pform({}); };
      $$('[data-pe]').forEach(function (b) { b.onclick = function () { pform(P.filter(function (x) { return x.id === +b.dataset.pe; })[0]); }; });
      $$('[data-pu]').forEach(function (b) { b.onclick = function () { var p = P.filter(function (x) { return x.id === +b.dataset.pu; })[0];
        form({deal: 'sale', type: 'flat', currency: 'USD', city: p.city, district: p.district, address: p.address, lat: p.lat, lon: p.lon, project_id: p.id, contact_name: ME.company || ME.name, contact_phone: ME.phone, photos: []}); }; });
    });
  }
  function pform(p) {
    var v = function (k) { return esc(p[k] == null ? '' : p[k]); };
    $('#app').innerHTML = '<form class="card formcard" id="pjf"><h1>' + (p.id ? t('Edit project', 'პროექტის რედაქტირება') : t('New project', 'ახალი პროექტი')) + '</h1>' +
      '<label class="f">' + t('Project name', 'პროექტის სახელი') + '<input name="name" required value="' + v('name') + '"></label>' +

      '<p class="muted" style="margin:0;font-size:13px" id="pubnote">' + t('Paid options are only pre-selected on MyHome / SS — you check the total and press Pay there yourself. Top up the balance on MyHome / SS first.',
        'ფასიანი სერვისი მხოლოდ წინასწარ მოინიშნება MyHome / SS-ზე — ჯამს შენ ამოწმებ და გადახდას თავად აჭერ. ჯერ შეავსე ბალანსი MyHome / SS-ზე.') + '</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn b-gold" type="button" id="pubgo">' + t('Get code', 'კოდის მიღება') + '</button>' +
      '<button class="btn b-ghost" type="button" id="pubx">' + t('Close', 'დახურვა') + '</button></div><div id="pubout"></div>' +
      '<details style="border-top:1px solid var(--line);padding-top:10px"' + (l.ext && (l.ext.myhome || l.ext.ss) ? ' open' : '') + '><summary style="cursor:pointer;font-weight:600">' + t('Already on MyHome / SS? Add the link', 'უკვე არის MyHome / SS-ზე? დაამატე ლინკი') + '</summary>' +
      '<div id="pubext" style="margin:8px 0">' + KG.extBadges(l.ext) + '</div>' +
      '<div style="display:flex;gap:8px"><input id="publink" placeholder="https://www.myhome.ge/pr/… / https://home.ss.ge/…" style="flex:1"><button class="btn b-navy" type="button" id="publinkgo">' + t('Save', 'შენახვა') + '</button></div>' +
      '<div class="muted" style="font-size:12px;margin-top:6px" id="publinkmsg"></div></details></div>';
    document.body.appendChild(box);
    var c = box.querySelector('#pubc');
    box.querySelector('#pubx').onclick = function () { box.remove(); dash(); };
    box.querySelector('#publinkgo').onclick = function () {
      api('/api/my/listings/' + l.id + '/ext', {method: 'POST', json: {url: box.querySelector('#publink').value}}).then(function (r) {
        box.querySelector('#publinkmsg').textContent = r.ok ? t('Saved ✓', 'შენახულია ✓') : r.error;
        if (r.ok) { l.ext = r.ext; box.querySelector('#pubext').innerHTML = KG.extBadges(r.ext); box.querySelector('#publink').value = ''; }
      });
    };
    function cost() {
      var tier = c.querySelector('input[name=tier]:checked').value, p = PROMO.filter(function (x) { return x[0] === tier; })[0];
      var days = Math.max(1, Math.min(30, +c.querySelector('input[name=days]').value || 1)), mhDays = tier === 'vip' ? days : Math.min(days, 4);
      c.querySelector('#pubdays').style.display = tier ? 'flex' : 'none';
      Array.prototype.forEach.call(c.querySelectorAll('#pubtiers > label'), function (lb) { lb.style.borderColor = lb.querySelector('input').checked ? 'var(--gold)' : 'transparent'; });
      c.querySelector('#pubcost').textContent = tier ? 'MyHome ≈ ' + (p[2] * mhDays).toFixed(2) + '₾' + (mhDays < days ? ' (' + mhDays + ' ' + t('days max', 'დღე მაქს.') + ')' : '') : '';
      return tier ? {tier: tier, days: days} : null;
    }
    c.addEventListener('change', cost); c.addEventListener('input', cost);
    box.querySelector('#pubgo').onclick = function () {
      var promo = cost();
      api('/api/my/listings/' + l.id + '/publish-code', {method: 'POST', json: {promo: promo}}).then(function (r) {
        if (!r.ok) { alert(r.error); return; }
        var pl = r.promo ? PROMO.filter(function (x) { return x[0] === r.promo.tier; })[0][1] + ' · ' + r.promo.days + ' ' + t('days', 'დღე') : t('Free', 'უფასო');
        box.querySelector('#pubout').innerHTML =
          '<ol style="margin:0 0 10px;padding-left:18px;line-height:1.6"><li>' + t('Open MyHome or SS below (you must be logged in to your own account there).', 'გახსენი MyHome ან SS (შენს ანგარიშზე უნდა იყო შესული).') + '</li>' +
          '<li>' + t('Press the bookmark “KEY GROUP ⇢ fill” — the form fills itself.', 'დააჭირე სანიშნეს „KEY GROUP ⇢ fill“ — ფორმა თავად შეივსება.') + '</li>' +
          '<li>' + t('Check it, fix the ⚠️ items and press Publish / Pay there yourself.', 'შეამოწმე, შეასწორე ⚠️ და თავად დააჭირე გამოქვეყნებას / გადახდას.') + '</li></ol>' +
          '<div>' + t('Code (valid 2 hours): ', 'კოდი (2 საათი): ') + '<b style="font:800 20px var(--display);letter-spacing:.08em;user-select:all">' + esc(r.code) + '</b> · ' + esc(pl) + '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a class="btn b-coral" target="_blank" rel="noopener" href="' + esc(r.myhome) + '">MyHome.ge ↗</a><a class="btn b-navy" target="_blank" rel="noopener" href="' + esc(r.ss) + '">SS.ge ↗</a>' +
          '<a class="btn b-ghost" target="_blank" href="/publish/">' + t('Install the bookmark', 'სანიშნის დაყენება') + '</a></div>';
      });
    };
  }

  // ---------------- add / edit
  function sel(name, opts, val) { return '<select name="' + name + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (String(val) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>'; }
  function form(l) {
    l = l || {deal: 'rent', type: 'flat', currency: 'USD', city: 'Tbilisi', contact_name: ME.name, contact_phone: ME.phone, photos: []};
    var v = function (k) { return esc(l[k] == null || l[k] === 0 ? '' : l[k]); };
    $('#app').innerHTML = '<form class="card formcard" id="lf"><div class="dash-head" style="margin:0"><h1>' + (l.id ? t('Edit listing', 'რედაქტირება') + ' #' + l.id : t('New listing', 'ახალი განცხადება')) + '</h1><button type="button" class="btn b-ghost" id="back">' + t('Back', 'უკან') + '</button></div>' +
      '<div class="grid3"><label class="f">' + t('Deal', 'გარიგება') + sel('deal', [['rent', KG.DEAL('rent')], ['sale', KG.DEAL('sale')], ['daily', KG.DEAL('daily')]], l.deal) + '</label>' +
      '<label class="f">' + t('Property type', 'ქონების ტიპი') + sel('type', [['flat', KG.TYPE('flat')], ['house', KG.TYPE('house')], ['commercial', KG.TYPE('commercial')], ['land', KG.TYPE('land')], ['hotel', KG.TYPE('hotel')]], l.type) + '</label>' +
      '<label class="f">' + t('City', 'ქალაქი') + sel('city', [['Tbilisi', t('Tbilisi', 'თბილისი')], ['Batumi', t('Batumi', 'ბათუმი')], ['Kutaisi', t('Kutaisi', 'ქუთაისი')], ['Other', t('Other', 'სხვა')]], l.city) + '</label></div>' +
      '<div class="grid2"><label class="f">' + t('District', 'უბანი') + '<input name="district" value="' + v('district') + '" placeholder="' + t('Vake, Saburtalo…', 'ვაკე, საბურთალო…') + '" required></label>' +
      '<label class="f">' + t('Street and number', 'ქუჩა და ნომერი') + '<input name="address" value="' + v('address') + '"></label></div>' +
      '<div><b style="font:700 14px var(--display)">' + t('Location on the map', 'მდებარეობა რუკაზე') + '</b> <span class="muted" style="font-size:13px">' + t('optional — tap the map to drop a pin. Buyers see an approximate area (~100 m), not your exact door.', 'არასავალდებულო — დააჭირეთ რუკას. მყიდველი ხედავს მიახლოებით ადგილს (~100 მ).') + '</span>' +
      '<div id="pick" style="height:260px;border-radius:14px;border:1px solid var(--line);margin-top:8px;background:#E8EEF3"></div><input type="hidden" name="lat" value="' + (l.lat || '') + '"><input type="hidden" name="lon" value="' + (l.lon || '') + '">' +
      '<button type="button" class="btn sm b-ghost hidden" id="unpin" style="margin-top:6px">' + t('Remove pin', 'პინის წაშლა') + '</button></div>' +
      (ME.role === 'developer' || ME.role === 'admin' ? '<div class="grid3" id="projrow"><label class="f">' + t('Project', 'პროექტი') + '<select name="project_id"><option value="0">—</option></select></label><label class="f">' + t('Building / block', 'კორპუსი / ბლოკი') + '<input name="building" value="' + v('building') + '"></label><label class="f">' + t('Unit number', 'ბინის ნომერი') + '<input name="unit_no" value="' + v('unit_no') + '"></label></div>' : '') +
      '<div class="grid4"><label class="f">' + t('Rooms', 'ოთახები') + '<input name="rooms" type="number" min="0" value="' + v('rooms') + '"></label><label class="f">' + t('Bedrooms', 'საძინებელი') + '<input name="bedrooms" type="number" min="0" value="' + v('bedrooms') + '"></label>' +
      '<label class="f">' + t('Area, m²', 'ფართი, მ²') + '<input name="area" type="number" min="0" step="0.1" value="' + v('area') + '"></label><label class="f">' + t('Floor / of', 'სართული / სულ') + '<span style="display:flex;gap:6px"><input name="floor" value="' + v('floor') + '" style="width:50%"><input name="total_floors" value="' + v('total_floors') + '" style="width:50%"></span></label></div>' +
      '<div class="grid3"><label class="f">' + t('Price', 'ფასი') + '<input name="price" type="number" min="0" value="' + v('price') + '" required></label><label class="f">' + t('Currency', 'ვალუტა') + sel('currency', [['USD', '$ USD'], ['GEL', '₾ GEL'], ['EUR', '€ EUR']], l.currency) + '</label><span></span></div>' +
      '<label class="f">' + t('Title (optional)', 'სათაური (არასავალდებულო)') + '<input name="title" maxlength="140" value="' + v('title') + '" placeholder="' + t('Renovated 3-room apartment near Vake Park', 'გარემონტებული 3 ოთახიანი ბინა ვაკის პარკთან') + '"></label>' +
      '<label class="f">' + t('Description', 'აღწერა') + '<textarea name="description" maxlength="5000">' + v('description') + '</textarea></label>' +
      '<label class="f">' + t('Video tour link (optional — YouTube or Vimeo)', 'ვიდეო ტურის ბმული (არასავალდებულო — YouTube ან Vimeo)') + '<input name="video_url" type="url" value="' + v('video_url') + '" placeholder="https://www.youtube.com/watch?v=…"></label>' +
      '<div class="grid2"><label class="f">' + t('Contact name', 'საკონტაქტო პირი') + '<input name="contact_name" value="' + v('contact_name') + '"></label><label class="f">' + t('Contact phone', 'საკონტაქტო ტელეფონი') + '<input name="contact_phone" type="tel" value="' + v('contact_phone') + '" required></label></div>' +
      '<div><b>' + t('Photos', 'ფოტოები') + '</b> <span class="muted" style="font-size:13px">' + t('up to 15, the first one is the main photo', 'მაქს. 15, პირველი მთავარია') + '</span>' +
      '<div class="photos" id="phs" style="margin-top:10px"></div>' +
      '<label class="drop" style="display:block;margin-top:10px">' + KG.icon('image') + ' ' + (l.id ? t('Add photos', 'ფოტოების დამატება') : t('Photos can be added after saving', 'ფოტოებს შენახვის შემდეგ დაამატებ')) + '<input type="file" id="pf" accept="image/*" multiple class="hidden"' + (l.id ? '' : ' disabled') + '></label></div>' +
      '<p class="muted" style="font-size:13px;margin:0">' + t('Every new or edited listing is checked by KEY GROUP before it goes live (usually within a few hours).', 'ყველა ახალი ან შეცვლილი განცხადება მოწმდება KEY GROUP-ის მიერ (ჩვეულებრივ რამდენიმე საათში).') + '</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn b-coral" type="submit">' + (l.id ? t('Save changes', 'შენახვა') : t('Save and add photos', 'შენახვა და ფოტოები')) + '</button></div><div id="lm"></div></form>';
    $('#back').onclick = dash;
    // map pin
    KG.leaflet().then(function (L) {
      var f = $('#lf'); if (!f || !$('#pick')) return;
      var start = l.lat ? [l.lat, l.lon] : (KG.center(l.district, l.city) || null);
      var map = KG.baseMap('pick', start, l.lat ? 16 : 13), mk = null;
      function setPin(ll) {
        if (mk) mk.remove();
        if (!ll) { f.lat.value = ''; f.lon.value = ''; $('#unpin').classList.add('hidden'); return; }
        mk = L.circleMarker(ll, {radius: 9, color: '#fff', weight: 2, fillColor: '#F45D48', fillOpacity: 1}).addTo(map);
        f.lat.value = ll[0].toFixed(6); f.lon.value = ll[1].toFixed(6); $('#unpin').classList.remove('hidden');
      }
      if (l.lat) setPin([l.lat, l.lon]);
      map.on('click', function (e) { setPin([e.latlng.lat, e.latlng.lng]); });
      $('#unpin').onclick = function () { setPin(null); };
      f.district.addEventListener('change', function () { if (!f.lat.value) { var c = KG.center(f.district.value, f.city.value); if (c) map.setView(c, 14); } });
    }).catch(function () { var pk = $('#pick'); if (pk) pk.outerHTML = '<p class="muted">' + t('Map could not load — you can save without a pin.', 'რუკა ვერ ჩაიტვირთა.') + '</p>'; });
    if ($('#projrow')) api('/api/my/projects').then(function (j) {
      var sl = $('select[name=project_id]'); if (!sl || !j.ok) return;
      sl.innerHTML = '<option value="0">— ' + t('no project', 'პროექტის გარეშე') + ' —</option>' + j.projects.map(function (p) { return '<option value="' + p.id + '"' + (l.project_id === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('');
    });
    function drawPhotos() {
      $('#phs').innerHTML = (l.photos || []).map(function (p, i) { return '<div class="p" style="background-image:url(' + KG.photo(p, true) + ')">' + (i === 0 ? '<span class="main">' + t('MAIN', 'მთავარი') + '</span>' : '<button type="button" data-first="' + esc(p) + '" style="left:4px;right:auto" title="' + t('Make main', 'მთავარი') + '">★</button>') + '<button type="button" data-rm="' + esc(p) + '" aria-label="' + t('Remove', 'წაშლა') + '">×</button></div>'; }).join('');
      $$('[data-rm]').forEach(function (b) { b.onclick = function () { api('/api/my/listings/' + l.id + '/photos?name=' + encodeURIComponent(b.dataset.rm), {method: 'DELETE'}).then(function (j) { if (j.ok) { l.photos = j.photos; drawPhotos(); } }); }; });
      $$('[data-first]').forEach(function (b) { b.onclick = function () { api('/api/my/listings/' + l.id + '/photos', {method: 'PUT', json: {photos: [b.dataset.first]}}).then(function (j) { if (j.ok) { l.photos = j.photos; drawPhotos(); } }); }; });
    }
    drawPhotos();
    $('#pf').onchange = function () {
      var fd = new FormData(); Array.prototype.forEach.call($('#pf').files, function (f) { fd.append('photos', f); });
      $('#lm').className = 'msg info'; $('#lm').textContent = t('Uploading…', 'იტვირთება…');
      api('/api/my/listings/' + l.id + '/photos', {method: 'POST', form: fd}).then(function (j) {
        $('#lm').className = 'msg ' + (j.ok ? 'ok' : 'err'); $('#lm').textContent = j.ok ? t('Photos uploaded', 'ფოტოები აიტვირთა') : j.error;
        if (j.ok) { l.photos = j.photos; drawPhotos(); }
        $('#pf').value = '';
      });
    };
    $('#lf').onsubmit = function (e) {
      e.preventDefault();
      var data = {}; Array.prototype.forEach.call(e.target.elements, function (el) { if (el.name) data[el.name] = el.value; });
      api(l.id ? '/api/my/listings/' + l.id : '/api/my/listings', {method: l.id ? 'PUT' : 'POST', json: data}).then(function (j) {
        if (!j.ok) { $('#lm').className = 'msg err'; $('#lm').textContent = j.error; return; }
        if (!l.id) { l.id = j.id; l.status = 'pending'; Object.assign(l, data); form(l); $('#lm').className = 'msg ok'; $('#lm').textContent = t('Saved! Now add photos, then go back to your listings.', 'შენახულია! ახლა დაამატე ფოტოები.'); return; }
        $('#lm').className = 'msg ok'; $('#lm').textContent = t('Saved. It will be live again after a quick check.', 'შენახულია. შემოწმების შემდეგ გამოქვეყნდება.');
      });
    };
  }

  // ---------------- promote (VIP / Super VIP / Boost)
  function promo(l) {
    var P = SETTINGS.plans, cur = SETTINGS.currency === 'GEL' ? '₾' : SETTINGS.currency, choice = 'vip';
    var d = $('#promo');
    d.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px"><h2>' + t('Get more views', 'მეტი ნახვა') + '</h2><p class="muted" style="margin:0">' + esc(l.title || KG.TYPE(l.type) + ' · ' + (l.district || '')) + '</p>' +
      '<div class="plans">' + [['super', t('Top of the list and the home page, with the Super VIP badge', 'სიის თავში და მთავარ გვერდზე, Super VIP ნიშნით')], ['vip', t('Above free listings, with the VIP badge', 'უფასო განცხადებების ზემოთ, VIP ნიშნით')], ['boost', t('Moves your listing to the top once, like new', 'ერთხელ აიწევს სიის თავში, როგორც ახალი')]].map(function (p) {
        var c = P[p[0]];
        return '<button type="button" class="plan" data-p="' + p[0] + '" aria-pressed="' + (p[0] === choice) + '"><span class="pill ' + (p[0] === 'super' ? 't-super' : p[0] === 'vip' ? 't-vip' : 'st-pending') + '">' + esc(c.name) + '</span><b>' + cur + c.price + '</b><span class="muted" style="font-size:13px">' + (c.days ? c.days + ' ' + t('days', 'დღე') + ' · ' : '') + esc(p[1]) + '</span></button>';
      }).join('') + '</div>' +
      '<div class="msg info">' + esc(SETTINGS.payment_info) + '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn b-coral" id="ord">' + t('Order', 'შეკვეთა') + '</button><button class="btn b-ghost" id="cl">' + t('Close', 'დახურვა') + '</button></div><div id="om"></div></div>';
    d.showModal();
    $$('.plan', d).forEach(function (b) { b.onclick = function () { choice = b.dataset.p; $$('.plan', d).forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }; });
    $('#cl').onclick = function () { d.close(); dash(); };
    $('#ord').onclick = function () {
      api('/api/my/listings/' + l.id + '/order', {method: 'POST', json: {plan: choice}}).then(function (j) {
        if (!j.ok) { $('#om').className = 'msg err'; $('#om').textContent = j.error; return; }
        $('#ord').disabled = true;
        $('#om').className = 'msg ok';
        $('#om').innerHTML = t('Order #', 'შეკვეთა #') + j.order.id + ' — ' + cur + j.order.amount + '. ' + t('Write the order number in your payment comment. The plan starts as soon as we receive the payment.', 'გადახდისას მიუთითე შეკვეთის ნომერი. პაკეტი ჩაირთვება გადახდის მიღებისთანავე.') +
          ' <a class="btn sm b-wa" target="_blank" rel="noopener" href="https://wa.me/995577114118?text=' + encodeURIComponent('Order #' + j.order.id + ' (' + j.order.plan + ') listing #' + l.id) + '">WhatsApp</a>';
      });
    };
  }
  boot();
})();
</script>
</body>
