<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — KEY GROUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/portal.css">
<style>
.pg{padding:24px 0 64px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 20px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font:700 14px var(--display);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs .n{background:var(--coral);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpis .card{padding:18px}.kpis b{display:block;font:800 30px var(--display)}.kpis span{color:var(--muted);font-size:13px}
.item{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .th{height:110px;border-radius:12px;background:#DCE3EA center/cover}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thumbs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.thumbs a{width:56px;height:42px;border-radius:6px;background:#DCE3EA center/cover;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 12px var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--page)}
.tablewrap{overflow-x:auto}
.desc{white-space:pre-wrap;font-size:13px;color:#33465c;max-height:90px;overflow:auto;margin-top:6px;background:var(--page);border-radius:8px;padding:8px}
@media (max-width:700px){.item{grid-template-columns:1fr}.item .th{height:180px}}
.chatwrap{display:grid;grid-template-columns:320px 1fr;gap:16px;min-height:560px}
.clist{overflow:auto;max-height:640px}.clist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px 14px;cursor:pointer}
.clist button.on{background:var(--sky)}.clist b{font:700 14px var(--display)}.clist .ls{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;min-height:560px}.thread .msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;max-height:520px;background:var(--page)}
.bub{max-width:78%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.bub.visitor{background:#fff;border:1px solid var(--line);align-self:flex-start}.bub.bot{background:#EEF1F5;color:#33465c;align-self:flex-end;font-size:13px}
.bub.agent{background:var(--navy);color:#fff;align-self:flex-end}.bub.system{align-self:center;color:var(--muted);font-size:12px}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.thread form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.thread textarea{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;min-height:46px;resize:vertical}
@media (max-width:800px){.chatwrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap pg" id="app"><div class="empty">…</div></main>
<script src="/assets/portal.js"></script>
<script>
(function () {
  KG.lang = 'en';
  var esc = KG.esc, $ = KG.$, $$ = KG.$$, api = KG.api, TAB = 'dash', LSTAT = 'pending', STATS = {};
  KG.header('admin');
  var fmtDate = function (ts) { return ts ? new Date(ts * 1000).toLocaleString('en-GB', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'}) : '—'; };

  function login() {
    $('#app').innerHTML = '<form class="card" id="lf" style="max-width:420px;margin:30px auto;padding:28px;display:flex;flex-direction:column;gap:14px"><h1>Admin login</h1>' +
      '<label class="f">Phone<input name="phone" type="tel" required autocomplete="username"></label><label class="f">Password<input name="password" type="password" required autocomplete="current-password"></label>' +
      '<label class="f hidden" id="codebox">6-digit code from your authenticator app<input name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>' +
      '<button class="btn b-navy" type="submit">Log in</button><div id="lm"></div></form>';
    $('#lf').onsubmit = function (e) {
      e.preventDefault();
      api('/api/login', {method: 'POST', json: {phone: e.target.phone.value, password: e.target.password.value, code: e.target.code.value}}).then(function (j) {
        if (j.need_code) { $('#codebox').classList.remove('hidden'); e.target.code.focus(); }
        if (!j.ok) { $('#lm').className = 'msg err'; $('#lm').textContent = j.error; return; }
        if (['admin', 'moderator', 'finance'].indexOf(j.user.role) < 0) { $('#lm').className = 'msg err'; $('#lm').textContent = 'This account is not a staff account.'; return; }
        shell();
      });
    };
  }
  var TABPERM = {agents: '*', crm: 'crm', dash: 'stats', chats: 'chats', leads: 'leads', partners: 'partners', listings: 'listings', orders: 'orders', reports: 'reports', users: '*', analytics: 'analytics', performance: 'analytics', log: '*', settings: '*'};
  var ROLEPERM = {admin: ['*'], moderator: ['stats', 'listings', 'reports', 'chats', 'leads', 'partners', 'analytics', 'crm'], finance: ['stats', 'orders', 'analytics']};
  function can(tab) { var p = ROLEPERM[STATS.role || 'admin'] || []; return p.indexOf('*') >= 0 || p.indexOf(TABPERM[tab]) >= 0; }
  function allowedTabs(list) { var l = list.filter(function (x) { return can(x[0]); }); if (!can(TAB)) TAB = 'dash'; return l; }
  function shell() {
    api('/api/admin/stats').then(function (j) {
      if (!j.ok) { login(); return; }
      STATS = j.stats;
      var pend = (STATS.listings || {}).pending || 0;
      $('#app').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h1>KEY GROUP admin</h1>' +
        '<div style="display:flex;gap:8px"><a class="btn b-ghost" href="/account/">Owner view</a><button class="btn b-ghost" id="out">Log out</button></div></div>' +
        '<div class="tabs">' + allowedTabs([['dash', 'Dashboard', 0], ['listings', 'Listings', pend], ['crm', 'CRM', 0], ['agents', 'KEY Agents', 0], ['chats', 'Chats', STATS.chats_waiting], ['leads', 'Leads', STATS.leads_new], ['partners', 'Partners', STATS.apps_new], ['orders', 'Payments', STATS.orders_waiting], ['reports', 'Reports', STATS.reports_open], ['users', 'Users', 0], ['analytics', 'Analytics', 0], ['performance', 'Performance', STATS.viewings_soon], ['log', 'Activity log', 0], ['settings', 'Plans & settings', 0]]).map(function (x) {
          return '<button data-t="' + x[0] + '" aria-pressed="' + (TAB === x[0]) + '">' + x[1] + (x[2] ? ' <span class="n">' + x[2] + '</span>' : '') + '</button>';
        }).join('') + '</div><div id="tab"></div>';
      $$('[data-t]').forEach(function (b) { b.onclick = function () { TAB = b.dataset.t; shell(); }; });
      $('#out').onclick = function () { api('/api/logout', {method: 'POST'}).then(login); };
      clearInterval(window.__chatTimer);
      ({agents: agentsTab, crm: function () { crmTab(false); }, performance: performance, leads: leadsTab, partners: partnersTab, analytics: analytics, log: activity, dash: dash, chats: chats, listings: listings, orders: orders, reports: reports, users: users, settings: settings})[TAB]();
    });
  }
  function editProfile(id, after) {
    api('/api/admin/users', {method: 'POST', json: {id: +id, action: 'get_profile'}}).then(function (r) {
      if (!r.ok) { kgModal('<div class="msg err">' + esc(r.error || 'Error') + '</div>'); return; }
      var P = r.profile, L = P.links || {}, f = function (n, label, val, extra) { return '<label class="f">' + label + '<input name="' + n + '" value="' + esc(val || '') + '"' + (extra || '') + '></label>'; };
      var box = kgModal('<h3>Edit profile — ' + esc(P.phone) + '</h3><form id="epf" style="display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto">' +
        f('name', 'Name', P.name) + f('company', 'Company / agency (profile title for partners)', P.company) +
        f('slug', 'Public link: keygroup.ge/…/', P.slug) + f('email', 'Email', P.email) +
        f('myhome', 'MyHome.ge profile link', L.myhome, ' placeholder="https://www.myhome.ge/…"') + f('ss', 'SS.ge profile link', L.ss, ' placeholder="https://home.ss.ge/…"') +
        '<label class="f">About<textarea name="bio" style="min-height:70px">' + esc(P.bio || '') + '</textarea></label>' +
        '<div style="display:flex;gap:8px"><button class="btn b-coral" type="submit">Save</button><button class="btn b-ghost" type="button" id="epx">Cancel</button></div><div id="epm"></div></form>');
      box.querySelector('#epx').onclick = function () { box.remove(); };
      box.querySelector('#epf').onsubmit = function (e) {
        e.preventDefault(); var x = e.target;
        api('/api/admin/users', {method: 'POST', json: {id: +id, action: 'edit_profile', profile: {name: x.name.value, company: x.company.value, slug: x.slug.value, email: x.email.value, bio: x.bio.value, links: {myhome: x.myhome.value, ss: x.ss.value}}}}).then(function (res) {
          if (!res.ok) { box.querySelector('#epm').className = 'msg err'; box.querySelector('#epm').textContent = res.error; return; }
          box.remove(); if (after) after();
        });
      };
    });
  }
  // password reset: temporary password + one-time login link, shown once, ready to send on WhatsApp
  // in-page dialog (browser confirm/alert pop-ups are blocked in some browsers and in-app panes)
  function kgModal(html) {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;background:rgba(5,12,24,.55);display:grid;place-items:center;z-index:60;padding:16px';
    box.innerHTML = '<div class="card" style="padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:10px">' + html + '</div>';
    document.body.appendChild(box);
    return box;
  }
  function editProfile(id, after) {
    api('/api/admin/users', {method: 'POST', json: {id: +id, action: 'get_profile'}}).then(function (r) {
      if (!r.ok) { kgModal('<div class="msg err">' + esc(r.error || 'Error') + '</div>'); return; }
      var P = r.profile, L = P.links || {}, f = function (n, label, val, extra) { return '<label class="f">' + label + '<input name="' + n + '" value="' + esc(val || '') + '"' + (extra || '') + '></label>'; };
      var box = kgModal('<h3>Edit profile — ' + esc(P.phone) + '</h3><form id="epf" style="display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto">' +
        f('name', 'Name', P.name) + f('company', 'Company / agency (profile title for partners)', P.company) +
        f('slug', 'Public link: keygroup.ge/…/', P.slug) + f('email', 'Email', P.email) +
        f('myhome', 'MyHome.ge profile link', L.myhome, ' placeholder="https://www.myhome.ge/…"') + f('ss', 'SS.ge profile link', L.ss, ' placeholder="https://home.ss.ge/…"') +
        '<label class="f">About<textarea name="bio" style="min-height:70px">' + esc(P.bio || '') + '</textarea></label>' +
        '<div style="display:flex;gap:8px"><button class="btn b-coral" type="submit">Save</button><button class="btn b-ghost" type="button" id="epx">Cancel</button></div><div id="epm"></div></form>');
      box.querySelector('#epx').onclick = function () { box.remove(); };
      box.querySelector('#epf').onsubmit = function (e) {
        e.preventDefault(); var x = e.target;
        api('/api/admin/users', {method: 'POST', json: {id: +id, action: 'edit_profile', profile: {name: x.name.value, company: x.company.value, slug: x.slug.value, email: x.email.value, bio: x.bio.value, links: {myhome: x.myhome.value, ss: x.ss.value}}}}).then(function (res) {
          if (!res.ok) { box.querySelector('#epm').className = 'msg err'; box.querySelector('#epm').textContent = res.error; return; }
          box.remove(); if (after) after();
        });
      };
    });
  }
  // password reset: temporary password + one-time login link, shown once, ready to send on WhatsApp
  function pwReset(id, after) {
    var box = kgModal('<h3>🔑 Reset password?</h3><p class="muted" style="margin:0">The user is logged out and gets a temporary password and a one-time login link that you send them. They choose their own password after logging in.</p>' +
      '<div style="display:flex;gap:8px"><button class="btn b-coral" type="button" id="pwgo">Reset password</button><button class="btn b-ghost" type="button" id="pwno">Cancel</button></div><div id="pwerr"></div>');
    box.querySelector('#pwno').onclick = function () { box.remove(); };
    box.querySelector('#pwgo').onclick = function () {
      this.disabled = true; this.textContent = '…';
      api('/api/admin/users', {method: 'POST', json: {id: +id, action: 'reset_password'}}).then(function (r) {
        if (!r.ok) { box.querySelector('#pwerr').className = 'msg err'; box.querySelector('#pwerr').textContent = r.error || 'Error'; box.querySelector('#pwgo').remove(); return; }
        var msg = 'KEY GROUP — ' + r.name + '\nLogin: keygroup.ge/account\nPhone: ' + r.phone + '\nTemporary password: ' + r.password + '\n(or one-tap login, 24 h: ' + r.link + ')\nPlease set your own password after logging in.';
        box.firstChild.innerHTML = '<h3>🔑 Password reset — ' + esc(r.name) + '</h3>' +
          (r.telegram ? '<div class="msg ok">✅ Sent automatically to their Telegram by the KEY GROUP bot — nothing else to do.</div>' : '<div class="msg err" style="background:var(--lemon);color:#7a5b00">Their Telegram is not linked yet, so send this yourself (WhatsApp button below). Tip: they can reset on their own any time — login page → “Forgot password? Reset it in Telegram”.</div>') +
          '<div>Phone: <b>' + esc(r.phone) + '</b></div><div>Temporary password: <b style="font:800 22px var(--display);letter-spacing:.06em;user-select:all">' + esc(r.password) + '</b></div>' +
          '<div class="muted" style="font-size:13px;word-break:break-all">One-tap login link (24 h, one use): <span style="user-select:all">' + esc(r.link) + '</span></div>' +
          '<p class="muted" style="font-size:12px;margin:0">Shown only now. The user is asked to choose their own password after logging in.</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn b-wa" target="_blank" rel="noopener" href="https://wa.me/' + String(r.phone).replace(/\D/g, '') + '?text=' + encodeURIComponent(msg) + '">Send on WhatsApp</a>' +
          '<button class="btn b-ghost" type="button" id="pwcopy">Copy message</button><button class="btn b-navy" type="button" id="pwclose">Close</button></div>';
        box.querySelector('#pwcopy').onclick = function () { var b2 = this; (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(function () { b2.textContent = 'Copied ✓'; }, function () { b2.textContent = 'Select the text above to copy'; }); };
        box.querySelector('#pwclose').onclick = function () { box.remove(); if (after) after(); };
      });
    };
  }
  function agentsTab() {
    api('/api/admin/agents').then(function (j) {
      if (!j.ok) { $('#tab').innerHTML = '<div class="msg err">' + esc(j.error) + '</div>'; return; }
      var A = j.agents || [], ago = function (ts) { if (!ts) return '—'; var d = (Date.now() / 1000 - ts) / 86400; return d < 1 ? 'today' : d < 2 ? 'yesterday' : Math.floor(d) + ' days ago'; };
      var tot = A.reduce(function (s, a) { return [s[0] + a.active, s[1] + a.crm_active, s[2] + a.leads_new]; }, [0, 0, 0]);
      $('#tab').innerHTML = '<div class="kpis">' + [[A.length, 'KEY GROUP agents'], [tot[0], 'Live on keygroup.ge'], [tot[1], 'Active in CRM (MyHome / SS)'], [tot[2], 'New leads not answered'],
          [A.filter(function (a) { return a.last_login && Date.now() / 1000 - a.last_login < 7 * 86400; }).length, 'Logged in this week'],
          [A.reduce(function (s, a) { return s + (a.on_ss || 0); }, 0) + ' / ' + tot[0], 'Live listings with an SS link'],
          [A.reduce(function (s, a) { return s + (a.no_photos || 0); }, 0), 'Live listings without photos']].map(function (k) { return '<div class="card"><b>' + esc(k[0]) + '</b><span>' + esc(k[1]) + '</span></div>'; }).join('') + '</div>' +
        '<details class="card" style="padding:14px 16px;margin:14px 0"' + (A.length ? '' : ' open') + '><summary style="cursor:pointer;font-weight:700">+ Add agents</summary>' +
        '<p class="muted" style="font-size:13px">Paste one agent per line: <code>577 15 11 41 ნინი n.name@gmail.com</code> (phone, name, optional email). Existing agents are updated, never duplicated. Each agent then opens their account with a login link (here or <b>/login</b> in the Telegram bot) and sets a password.</p>' +
        '<textarea id="agtxt" style="width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit"></textarea>' +
        '<div style="margin-top:8px;display:flex;gap:8px;align-items:center"><button class="btn b-navy" id="agadd">Create / update accounts</button><span id="agm"></span></div></details>' +
        '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px"><button class="btn b-gold" id="agsend">📨 Send every agent a login link (Telegram)</button>' +
        '<span class="muted" style="font-size:13px">' + A.filter(function (a) { return a.tg; }).length + ' of ' + A.length + ' agents can get it in Telegram</span><span id="agsm"></span></div>' +
        '<div class="card tablewrap"><table><thead><tr><th>Agent</th><th>Contact</th><th>keygroup.ge</th><th>On MyHome / SS</th><th>CRM (MyHome / SS)</th><th>Leads 30 d</th><th>Avg reply</th><th>Last login</th><th>Profiles</th><th></th></tr></thead><tbody>' +
        (A.length ? A.map(function (a) {
          var h = a.avg_hours;
          return '<tr' + (a.blocked ? ' style="opacity:.5"' : '') + '><td><b>' + esc(a.name) + '</b>' + (a.trusted ? ' <span class="pill t-vip">Trusted</span>' : '') + '<br><a href="/' + esc(a.slug) + '/" target="_blank" style="color:var(--blue);font-size:12px">keygroup.ge/' + esc(a.slug) + '/</a></td>' +
            '<td><a href="tel:' + esc(a.phone) + '" style="color:var(--blue)">' + esc(a.phone) + '</a><br><span class="muted" style="font-size:12px">' + esc(a.email || '') + '</span></td>' +
            '<td><b>' + a.active + '</b> live' + (a.pending ? ' · ' + a.pending + ' pending' : '') + (a.no_photos ? '<br><span style="color:var(--coral);font-size:12px">' + a.no_photos + ' without photos</span>' : '') + '<br><span class="muted" style="font-size:12px">last: ' + ago(a.last_listing) + '</span></td>' +
            '<td>MyHome <b>' + (a.on_myhome || 0) + '</b> · SS <b>' + (a.on_ss || 0) + '</b>' + (a.paid ? '<br><span class="pill t-vip" style="font-size:11px">' + a.paid + ' paid</span>' : '') +
              (a.dups ? '<br><span style="color:var(--coral);font-size:12px">' + a.dups + ' possible duplicates</span>' : '') + '</td>' +
            '<td><b>' + a.crm_active + '</b> active</td>' +
            '<td>' + a.leads30 + (a.leads_new ? ' · <b style="color:var(--coral)">' + a.leads_new + ' new</b>' : '') + '</td>' +
            '<td' + (h > 24 ? ' style="color:var(--coral);font-weight:700"' : '') + '>' + (h == null ? '—' : h < 1 ? Math.round(h * 60) + ' min' : h.toFixed(1) + ' h') + '</td>' +
            '<td>' + (a.tg ? '' : '<span class="muted" style="font-size:12px">no Telegram yet</span><br>') + (a.pw_set ? ago(a.last_login) : a.last_login ? ago(a.last_login) + '<br><span class="muted" style="font-size:12px">no password yet</span>' : '<span class="muted">never logged in</span>') + '</td>' +
            '<td>' + (a.links.myhome ? '<a href="' + esc(a.links.myhome) + '" target="_blank" style="color:var(--blue)">MyHome ↗</a> ' : '<span class="muted">MyHome —</span> ') + (a.links.ss ? '<a href="' + esc(a.links.ss) + '" target="_blank" style="color:var(--blue)">SS ↗</a>' : '<span class="muted">SS —</span>') + '</td>' +
            '<td style="white-space:nowrap"><button class="btn sm b-ghost" data-ag="link" data-id="' + a.id + '">Login link</button> <button class="btn sm b-ghost" data-ed="' + a.id + '">Edit</button> <button class="btn sm b-ghost" data-pw="' + a.id + '">🔑 Reset password</button> <button class="btn sm ' + (a.blocked ? 'b-ghost' : 'b-red') + '" data-ag="' + (a.blocked ? 'unblock' : 'block') + '" data-id="' + a.id + '">' + (a.blocked ? 'Unblock' : 'Block') + '</button></td></tr>';
        }).join('') : '<tr><td colspan="10" class="muted">No KEY GROUP agents yet — add them above.</td></tr>') + '</tbody></table></div>' +
        '<p class="muted" style="font-size:12px;margin-top:10px">CRM numbers come from each agent\'s Google Sheet (their MyHome / SS listings) and refresh every 10 minutes. Agents see the same list in their own dashboard.</p>';
      $('#agadd').onclick = function () { api('/api/admin/agents', {method: 'POST', json: {action: 'create', text: $('#agtxt').value}}).then(function (r) { $('#agm').className = 'msg ' + (r.ok ? 'ok' : 'err'); $('#agm').textContent = r.ok ? r.created.length + ' agent(s) saved' + (r.created.some(function (c) { return c.error; }) ? ' — some lines were skipped' : '') : r.error; if (r.ok) setTimeout(agentsTab, 900); }); };
      $('#agsend').onclick = function () {
        var b = this; b.disabled = true;
        api('/api/admin/agents', {method: 'POST', json: {action: 'send_links'}}).then(function (r) {
          b.disabled = false;
          $('#agsm').className = 'msg ' + (r.ok ? 'ok' : 'err');
          $('#agsm').textContent = r.ok ? '✅ Sent to ' + r.sent.length + (r.sent.length ? ' (' + r.sent.join(', ') + ')' : '') + (r.missing.length ? ' · no Telegram yet: ' + r.missing.join(', ') : '') : r.error;
        });
      };
      $$('[data-pw]').forEach(function (b) { b.onclick = function () { pwReset(b.dataset.pw, agentsTab); }; });
      $$('[data-ed]').forEach(function (b) { b.onclick = function () { editProfile(b.dataset.ed, agentsTab); }; });
      $$('[data-ag]').forEach(function (b) { b.onclick = function () {

      [0, 1, 2, 3].map(function (n) { return '<button class="btn sm ' + ((l.verify_level || 0) === n ? 'b-navy' : 'b-ghost') + '" style="min-height:30px;padding:4px 9px" title="' + ['None', 'Contact verified', 'Verified listing (authority, photos, price, availability)', 'Inspected (registry / on site)'][n] + '" data-a="level" data-l="' + n + '" data-id="' + l.id + '">' + (n ? 'L' + n : '—') + '</button>'; }).join('') + '</span>' +
      btn('vip', '+ VIP', 'b-ghost') + btn('super', '+ Super VIP', 'b-ghost') + btn('boost', 'Boost') +
      (l.tier !== 'free' ? btn('clear_plan', 'Clear plan') : '') + btn('delete', 'Delete', 'b-red') + '</div></div></div>';
  }
  function orders() {
    api('/api/admin/orders').then(function (j) {
      var O = j.orders || [];
      $('#tab').innerHTML = '<div class="card tablewrap"><table><thead><tr><th>Order</th><th>Owner</th><th>Listing</th><th>Plan</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>' +
        (O.length ? O.map(function (o) {
          return '<tr><td>#' + o.id + '<br><span class="muted">' + fmtDate(o.created) + '</span></td><td>' + esc(o.owner_name || '') + '<br><span class="muted">' + esc(o.owner_phone || '') + '</span></td>' +
            '<td><a href="/p/?id=' + o.listing_id + '" target="_blank" style="color:var(--blue)">#' + o.listing_id + '</a> ' + esc(o.district || o.address || '') + '</td><td>' + esc(o.plan) + '</td><td>' + esc(o.amount) + ' ' + esc(o.currency) + '</td>' +
            '<td><span class="pill ' + (o.status === 'paid' ? 'st-active' : o.status === 'cancelled' ? 'st-expired' : 'st-pending') + '">' + esc(o.status.replace('_', ' ')) + '</span>' + (o.paid ? '<br><span class="muted">' + fmtDate(o.paid) + '</span>' : '') + '</td>' +
            '<td>' + (o.status === 'awaiting_payment' ? '<button class="btn sm b-teal" data-o="paid" data-id="' + o.id + '">Mark paid → start plan</button> <button class="btn sm b-ghost" data-o="cancel" data-id="' + o.id + '">Cancel</button>' : esc(o.note || '')) + '</td></tr>';
        }).join('') : '<tr><td colspan="7" class="muted">No orders yet.</td></tr>') + '</tbody></table></div>';
      $$('[data-o]').forEach(function (b) {
        b.onclick = function () {
          var note = prompt(b.dataset.o === 'paid' ? 'Payment note (e.g. "TBC transfer 12 Nov"):' : 'Why cancelled?', '');
          if (note === null) return;
          api('/api/admin/orders/' + b.dataset.id, {method: 'POST', json: {action: b.dataset.o, note: note}}).then(function (r) { if (!r.ok) alert(r.error); shell(); });
        };
      });
    });
  }
  function reports() {
    api('/api/admin/reports').then(function (j) {
      var R = j.reports || [];
      $('#tab').innerHTML = '<div class="card tablewrap"><table><thead><tr><th>When</th><th>Listing</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>' +
        (R.length ? R.map(function (r) {
          return '<tr><td>' + fmtDate(r.created) + '</td><td><a href="/p/?id=' + r.listing_id + '" target="_blank" style="color:var(--blue)">#' + r.listing_id + '</a> ' + esc(r.district || '') + ' <span class="muted">(' + esc(r.listing_status || '') + ')</span></td>' +
            '<td>' + esc(r.reason) + '</td><td>' + esc(r.status) + '</td><td>' + (r.status === 'open' ? '<button class="btn sm b-ghost" data-r="' + r.id + '">Close</button>' : '') + '</td></tr>';
        }).join('') : '<tr><td colspan="5" class="muted">No reports.</td></tr>') + '</tbody></table></div>';
      $$('[data-r]').forEach(function (b) { b.onclick = function () { api('/api/admin/reports', {method: 'POST', json: {id: +b.dataset.r}}).then(shell); }; });
    });
  }
  function users() {
    api('/api/admin/users').then(function (j) {
      var U = j.users || [];
      $('#tab').innerHTML = '<div class="card" style="padding:12px;margin-bottom:10px"><input id="uq" placeholder="Search name, phone or company…" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit"></div>' +
        '<div class="card tablewrap"><table id="utab"><thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Listings</th><th>Joined</th><th></th></tr></thead><tbody>' +
        U.map(function (u) {
          return '<tr><td>' + esc(u.name) + (u.blocked ? ' <span class="pill st-rejected">blocked</span>' : '') + (u.contact_verified ? ' <span class="pill t-ver">contact verified</span>' : '') + (u.consent_at ? '<br><span class="muted" style="font-size:11px">consent ' + fmtDate(u.consent_at) + '</span>' : '') + '</td><td>' + esc(u.phone) + '</td><td>' + (u.role === 'admin' ? 'admin' : '<select data-role="' + u.id + '">' + ['owner', 'agent', 'agency', 'developer', 'moderator', 'finance'].map(function (r) { return '<option' + (u.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select>') + (u.company ? '<br><span class="muted" style="font-size:12px">' + esc(u.company) + '</span>' : '') + '</td><td>' + u.listings + (u.role !== 'admin' ? '<br><span class="muted" style="font-size:12px">limit <input data-limit="' + u.id + '" type="number" min="0" value="' + (u.listing_limit || '') + '" placeholder="default" style="width:70px;border:1px solid var(--line);border-radius:6px;padding:2px 4px"></span>' : '') + '</td><td>' + fmtDate(u.created) + '</td>' +
            '<td>' + (u.role !== 'admin' ? '<button class="btn sm b-ghost" data-u="' + (u.blocked ? 'unblock' : 'block') + '" data-id="' + u.id + '">' + (u.blocked ? 'Unblock' : 'Block') + '</button> <button class="btn sm b-ghost" data-u="reset_password" data-id="' + u.id + '">Reset password</button> <button class="btn sm b-ghost" data-u="' + (u.contact_verified ? 'unverify_contact' : 'verify_contact') + '" data-id="' + u.id + '">' + (u.contact_verified ? 'Unverify contact' : 'Verify contact (L1)') + '</button>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      $$('[data-role]').forEach(function (sl) { sl.onchange = function () { api('/api/admin/users', {method: 'POST', json: {id: +sl.dataset.role, action: 'set_role', role: sl.value}}); }; });
      $$('[data-limit]').forEach(function (inp) { inp.onchange = function () { api('/api/admin/users', {method: 'POST', json: {id: +inp.dataset.limit, action: 'set_limit', limit: +inp.value || 0}}); }; });
      setTimeout(function () { $$('#utab [data-ed]').forEach(function (b) { b.onclick = function () { editProfile(b.dataset.ed, shell); }; }); }, 0);
      $('#uq').oninput = function () { var q = this.value.toLowerCase(); $$('#utab tbody tr').forEach(function (tr) { tr.style.display = tr.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none'; }); };
      $$('[data-u]').forEach(function (b) {
        if (b.dataset.u === 'reset_password') b.insertAdjacentHTML('afterend', ' <button class="btn sm b-ghost" data-ed="' + b.dataset.id + '">Edit</button>');
        if (b.dataset.u === 'reset_password') b.textContent = '🔑 Reset password';
        b.onclick = function () {
          if (b.dataset.u === 'reset_password') { pwReset(b.dataset.id, shell); return; }

          api('/api/admin/users', {method: 'POST', json: {id: +b.dataset.id, action: b.dataset.u}}).then(function (r) {
            if (r.password) alert('New password: ' + r.password + '\nSend it to the owner on WhatsApp.');
            shell();
          });
        };
      });
    });
  }
  function settings() {
    api('/api/admin/settings').then(function (j) {
      var s = j.settings, P = s.plans;
      $('#tab').innerHTML = '<form class="card" id="sf" style="padding:22px;display:flex;flex-direction:column;gap:16px;max-width:820px"><h2>Plans & prices</h2>' +
        '<div class="tablewrap"><table><thead><tr><th>Plan</th><th>Price</th><th>Days</th><th>What it does</th></tr></thead><tbody>' +
        [['free', 'How long a free listing stays live'], ['vip', 'Above free listings, VIP badge'], ['super', 'Top of everything + home page, Super VIP badge'], ['boost', 'One bump to the top (days not used)']].map(function (p) {
          return '<tr><td><b>' + esc(P[p[0]].name) + '</b></td><td><input type="number" min="0" step="0.5" name="price_' + p[0] + '" value="' + P[p[0]].price + '" style="width:90px"' + (p[0] === 'free' ? ' disabled' : '') + '></td>' +
            '<td><input type="number" min="0" name="days_' + p[0] + '" value="' + P[p[0]].days + '" style="width:80px"' + (p[0] === 'boost' ? ' disabled' : '') + '></td><td class="muted">' + p[1] + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="grid2"><label class="f">Free listings per owner (0 = unlimited)<input type="number" min="0" name="free_listing_limit" value="' + (s.free_listing_limit == null ? 2 : s.free_listing_limit) + '"></label>' +
        '<label class="f">Ask owners to re-confirm availability after (days)<input type="number" min="1" name="reconfirm_days" value="' + (s.reconfirm_days || 15) + '"></label></div>' +
        '<div class="grid3"><label class="f">Agent listing limit<input type="number" min="0" name="rl_agent" value="' + s.role_limits.agent + '"></label><label class="f">Agency listing limit<input type="number" min="0" name="rl_agency" value="' + s.role_limits.agency + '"></label><label class="f">Developer listing limit<input type="number" min="0" name="rl_developer" value="' + s.role_limits.developer + '"></label></div>' +
        '<label class="f">Founding Partner free period (days)<input type="number" min="0" name="founding_days" value="' + (s.founding_days || 90) + '"></label>' +
        '<label class="f">Currency<select name="currency">' + ['GEL', 'USD', 'EUR'].map(function (c) { return '<option' + (s.currency === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></label>' +
        '<label class="f">Payment instructions shown to owners (bank account, office address)<textarea name="payment_info">' + esc(s.payment_info) + '</textarea></label>' +
        '<label style="display:flex;gap:8px;align-items:center;font:600 14px var(--display)"><input type="checkbox" name="show_owner_phone"' + (s.show_owner_phone ? ' checked' : '') + '> Show the owner\'s phone on listings (off = buyers contact KEY GROUP)</label>' +
        '<button class="btn b-navy" type="submit" style="align-self:flex-start">Save settings</button><div id="sm"></div></form>' +
        '<form class="card" id="pw" style="padding:22px;display:flex;flex-direction:column;gap:12px;max-width:420px;margin-top:18px"><h3>Change admin password</h3>' +
        '<label class="f">Current password<input name="old" type="password" required></label><label class="f">New password<input name="new" type="password" minlength="6" required></label><button class="btn b-ghost" type="submit">Change password</button><div id="pm"></div></form>';
      $('#sf').onsubmit = function (e) {
        e.preventDefault();
        var f = e.target, plans = {};
        ['free', 'vip', 'super', 'boost'].forEach(function (p) { plans[p] = {}; if (f['price_' + p] && !f['price_' + p].disabled) plans[p].price = f['price_' + p].value; if (f['days_' + p] && !f['days_' + p].disabled) plans[p].days = f['days_' + p].value; });
        api('/api/admin/settings', {method: 'POST', json: {plans: plans, role_limits: {agent: f.rl_agent.value, agency: f.rl_agency.value, developer: f.rl_developer.value}, founding_days: f.founding_days.value, free_listing_limit: f.free_listing_limit.value, reconfirm_days: f.reconfirm_days.value, currency: f.currency.value, payment_info: f.payment_info.value, show_owner_phone: f.show_owner_phone.checked}}).then(function (r) {
          $('#sm').className = 'msg ' + (r.ok ? 'ok' : 'err'); $('#sm').textContent = r.ok ? 'Saved.' : r.error; });
      };
      var tf = document.createElement('div'); tf.className = 'card'; tf.style.cssText = 'padding:22px;display:flex;flex-direction:column;gap:12px;max-width:520px;margin-top:18px';
      $('#pw').after(tf); twoFactor(tf);
      $('#pw').onsubmit = function (e) {
        e.preventDefault();
        api('/api/password', {method: 'POST', json: {old: e.target.old.value, new: e.target.new.value}}).then(function (r) {
          $('#pm').className = 'msg ' + (r.ok ? 'ok' : 'err'); $('#pm').textContent = r.ok ? 'Password changed.' : r.error; if (r.ok) e.target.reset(); });
      };
    });
  }
  if (['#chats', '#leads', '#partners', '#crm'].indexOf(location.hash) >= 0) TAB = location.hash.slice(1);
  api('/api/me').then(function (j) { j.user && ['admin', 'moderator', 'finance'].indexOf(j.user.role) >= 0 ? shell() : login(); });
})();
</script>
</body>
</html>
